<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tổng Tài TV · Quản trị</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --ink:#1B1F2A; --mute:#5B6272; --line:#E6E8EE; --bg:#F5F6FA; --gold:#C98A12; --card:#fff; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Be Vietnam Pro', Inter, system-ui, sans-serif; font-size: 15px; }
button, input { font-family: inherit; font-size: inherit; }
a { color: #2F6FDE; }
.logo { width: 36px; height: 36px; border-radius: 9px; background: linear-gradient(135deg,#FBE3A4,#E8B04B 45%,#A8691F); display: flex; align-items: center; justify-content: center; flex: none; }
.logo svg { width: 62%; height: 62%; }
.btn { min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { background: #F0F2F7; }
.btn.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.warn { background: #C2410C; color: #fff; border-color: #C2410C; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
/* đăng nhập */
#login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: linear-gradient(160deg,#FFF4DC 0%,#F5F6FA 55%); }
.lcard { width: 100%; max-width: 460px; background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 36px 32px; box-shadow: 0 30px 60px rgba(27,31,42,.10); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.lcard h1 { margin: 0; font-size: 26px; }
.lcard p { margin: 0; color: var(--mute); line-height: 1.6; }
.lnote { width: 100%; padding: 12px 14px; border-radius: 12px; background: var(--bg); font-size: 13px; color: var(--mute); text-align: left; }
.lerr { color: #B42318; font-weight: 600; }
.field { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--mute); }
.field input { min-height: 44px; border: 1px solid #D7DAE2; border-radius: 10px; padding: 0 12px; }
/* khung chính */
#app { display: none; min-height: 100vh; flex-wrap: wrap; }
nav.side { flex: 1 1 220px; max-width: 250px; background: #fff; border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 6px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 16px; }
.brand b { display: block; font-size: 16px; } .brand small { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--gold); }
.nav { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: #4A5163; text-decoration: none; font-weight: 500; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.nav.on { background: #FFF4DC; color: var(--ink); font-weight: 700; }
.nav svg { width: 19px; height: 19px; }
.me { margin-top: auto; padding: 14px 8px 0; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; font-size: 13px; }
.me img { width: 32px; height: 32px; border-radius: 50%; }
main { flex: 999 1 560px; min-width: 0; padding: 26px 30px 40px; display: flex; flex-direction: column; gap: 18px; max-width: 1260px; }
header.top { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: space-between; }
header.top h1 { margin: 0; font-size: 26px; }
header.top .sub { color: var(--mute); margin-top: 4px; font-size: 14px; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-weight: 600; cursor: pointer; }
.pill.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; min-width: 0; }
.card h2 { margin: 0 0 12px; font-size: 16px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 10px; align-items: center; }
.card h2 .btn { white-space: nowrap; flex: none; }
.card h2 > span { flex: 1 1 auto; }
.card h2 span { font-size: 13px; font-weight: 400; color: var(--mute); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.kpi .t { font-size: 13px; color: var(--mute); font-weight: 600; } .kpi .v { font-size: 28px; font-weight: 800; margin-top: 6px; } .kpi .s { font-size: 13px; color: var(--mute); margin-top: 4px; }
.row2 { display: flex; flex-wrap: wrap; gap: 14px; } .row2 > * { flex: 1 1 380px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 14px; font-size: 13px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chart { position: relative; margin: 0 0 28px 46px; }
.chart .grid { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
.chart .grid span { position: absolute; left: -46px; top: -9px; font-size: 11px; color: var(--mute); width: 40px; text-align: right; }
.bars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 4px; }
.bar { position: relative; flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
.bar .stack { display: flex; flex-direction: column; border-radius: 4px 4px 0 0; overflow: hidden; }
.bar .stack div { border-top: 2px solid #fff; }
.bar .lab { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--mute); white-space: nowrap; }
.tip { position: fixed; z-index: 10; background: var(--ink); color: #fff; padding: 8px 10px; border-radius: 8px; font-size: 12px; pointer-events: none; display: none; line-height: 1.5; }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--mute); padding: 8px; font-weight: 600; }
td { padding: 11px 8px; border-top: 1px solid var(--line); vertical-align: top; }
.av.pic { overflow: hidden; background: none; } .av.pic svg { display: block; width: 100%; height: 100%; }
.av { width: 32px; height: 32px; border-radius: 50%; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
.who { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
.muted { color: var(--mute); font-size: 13px; }
.live { color: #2B8A3E; font-weight: 700; } .live::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2B8A3E; margin-right: 6px; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; }
.tag.new { background: #FFE8D6; color: #A63F00; } .tag.block { background: #FDE2E1; color: #B42318; } .tag.ok { background: #E3F4E8; color: #1E6B33; }
.alert { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; background: #FFF4EC; border: 1px solid #FFC9A3; border-radius: 16px; padding: 16px 20px; }
.ubar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line); }
.ubar div { border-right: 2px solid #fff; }
.hbars { display: flex; flex-direction: column; gap: 10px; }
.hbar { display: grid; grid-template-columns: 170px 1fr 52px; gap: 12px; align-items: center; font-size: 14px; }
.hbar .tr { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; } .hbar .tr div { height: 100%; border-radius: 6px; }
.heat { display: flex; gap: 3px; } .heat div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; color: var(--mute); } .heat i { display: block; width: 100%; height: 44px; border-radius: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; } .chips span { padding: 5px 11px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); font-size: 13px; }
.empty { padding: 26px; text-align: center; color: var(--mute); }
.plist { display: flex; gap: 8px; flex-wrap: wrap; }
.plist button { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-weight: 600; }
.plist button.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.prog { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; width: 120px; } .prog div { height: 100%; }
.menu { position: relative; }
/* báo cáo PDF */
.rbar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; background: #FFF8E8; border-color: #F3D7A0; }
.rbar > div { flex: 1 1 320px; }
.report { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 30px 34px; display: flex; flex-direction: column; gap: 22px; }
.rhead { display: flex; gap: 14px; align-items: center; padding-bottom: 16px; border-bottom: 3px solid var(--gold); font-size: 13px; }
.rk { font-size: 12px; font-weight: 800; letter-spacing: .14em; color: var(--gold); }
.rt { font-size: 24px; font-weight: 800; margin-top: 2px; }
.rkpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.rkpis > div { background: var(--bg); border-radius: 12px; padding: 12px 14px; }
.rkpis .t { font-size: 12px; color: var(--mute); font-weight: 600; } .rkpis .v { font-size: 22px; font-weight: 800; margin-top: 4px; } .rkpis .s { font-size: 12px; color: var(--mute); margin-top: 2px; }
.rkpis.sm .v { font-size: 16px; }
.rsec h3 { margin: 0 0 12px; font-size: 18px; } .rsec h4 { margin: 14px 0 8px; font-size: 14px; }
.rsec td { padding: 8px; font-size: 13px; } .rsec th { padding: 6px 8px; font-size: 11px; }
.rprof { border-top: 1px solid var(--line); padding-top: 20px; }
.rcols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.rl { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.rl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* về app */
.nav.back { color: var(--gold); font-weight: 700; margin-bottom: 6px; border: 1px solid #F3D7A0; background: #FFFBF1; }
.nav.back:hover { background: #FFF4DC; }
/* Nhạc */
.mlist { display: flex; flex-direction: column; }
.mrow { display: grid; grid-template-columns: 34px minmax(0, 1.3fr) 64px 150px minmax(0, 2fr) auto; gap: 14px; align-items: center; padding: 12px 6px; border-top: 1px solid var(--line); }
.mrow:first-child { border-top: 0; }
.mrow .n { color: var(--mute); font-weight: 700; text-align: right; }
.mrow .t b { display: block; } .mrow .t small { color: var(--mute); font-size: 12px; }
.mrow .s { color: var(--mute); font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.45; }
.mrow .s.none { font-style: italic; color: #B42318; opacity: .75; }
.mhead { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--mute); font-weight: 600; padding-top: 0; border-top: 0; }
.msum { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.ed { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.ed .field textarea { min-height: 120px; border: 1px solid #D7DAE2; border-radius: 10px; padding: 10px 12px; font: inherit; line-height: 1.5; resize: vertical; }
.ed .field input[type=text] { min-height: 44px; border: 1px solid #D7DAE2; border-radius: 10px; padding: 0 12px; }
.ed .field small { color: var(--mute); font-size: 12px; }
.drop { border: 2px dashed #D7DAE2; border-radius: 14px; padding: 16px; display: flex; gap: 14px; align-items: center; background: #FAFBFD; cursor: pointer; }
.drop:hover { border-color: var(--gold); background: #FFFBF1; }
.drop .ic { width: 44px; height: 44px; border-radius: 12px; background: #FFF4DC; color: var(--gold); display: flex; align-items: center; justify-content: center; flex: none; }
.field label.drop { font-size: 15px; font-weight: 400; color: var(--ink); }
.drop b { display: block; font-weight: 700; overflow-wrap: anywhere; } .drop span { color: var(--mute); font-size: 13px; }
.drop.ok { border-style: solid; border-color: #9BD3AE; background: #F2FBF5; } .drop.ok .ic { background: #E3F4E8; color: #1E6B33; }
.lprev { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; }
.lprev div { display: flex; gap: 12px; padding: 7px 12px; border-top: 1px solid var(--line); font-size: 14px; }
.lprev div:first-child { border-top: 0; } .lprev i { font-style: normal; color: var(--gold); font-family: ui-monospace, Menlo, monospace; font-size: 13px; width: 48px; flex: none; }
.lprev em { color: var(--mute); font-size: 11px; letter-spacing: .1em; font-style: normal; font-weight: 700; }
.pv { background: #14161D; color: #F4EFE6; border-radius: 14px; padding: 18px 20px; }
.pv .k { font-size: 11px; letter-spacing: .2em; color: #E8B04B; font-weight: 800; } .pv .tt { font-size: 22px; font-weight: 800; margin: 4px 0 10px; }
.pv p { margin: 0 0 12px; line-height: 1.55; color: #D9D4CA; font-size: 14px; } .pv blockquote { margin: 0; padding-left: 12px; border-left: 3px solid #E8B04B; color: #F6DFA8; font-style: italic; line-height: 1.5; font-size: 14px; }
.edbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: flex-end; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 4px; }
.edbar .muted { margin-right: auto; }
.gh { display: flex; gap: 12px; align-items: center; background: #F0F6FF; border: 1px solid #C9DCF8; border-radius: 14px; padding: 12px 16px; font-size: 13px; color: #24427A; }
@media (max-width: 760px) {
  .mrow { grid-template-columns: 26px minmax(0, 1fr) auto; } .mrow .d, .mrow .l, .mrow .s, .mhead { display: none; }
  .ed { grid-template-columns: 1fr; }
  .nav.back { margin-bottom: 0; }
}
/* chung */
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: #F0F1F5; border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: transparent; padding: 8px 14px; border-radius: 9px; font: inherit; font-size: 14px; font-weight: 600; color: var(--mute); cursor: pointer; }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(27,31,42,.14); }
.seg button small { color: var(--mute); font-weight: 500; margin-left: 2px; }
.seg.sm button { padding: 6px 10px; font-size: 13px; }
.chk { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink); font-weight: 400; cursor: pointer; line-height: 1.45; }
.field label.chk, .chk { display: flex !important; flex-direction: row !important; }
.loud .chk { color: var(--ink); font-weight: 400; }
.chk input { flex: none; margin-top: 2px; accent-color: var(--ink); } .chk.big { font-size: 15px; font-weight: 600; }
.syncbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; border: 1px solid #F3D7A0; background: #FFFBF1; border-radius: 14px; padding: 12px 14px; }
.syncbar .btn { white-space: nowrap; flex: none; }
.syncbar b { display: block; } .syncbar span { color: var(--mute); font-size: 13px; }
.loud { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.loud .lm { position: relative; height: 10px; border-radius: 6px; background: #EEF0F4; }
.loud .lm i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 6px; background: linear-gradient(90deg, #7CC48F, #E8B04B 70%, #E8590C); transition: width .6s; }
.loud .lm b { position: absolute; top: -4px; width: 2px; height: 18px; background: var(--ink); left: 0; }
.loud .lt { font-size: 14px; }
/* trình canh lời */
.sync .tr { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sync .grow { flex: 1; }
.sync .play { width: 48px; height: 48px; border-radius: 50%; border: 0; background: linear-gradient(160deg, #F6DFA8, #C9973F); font-size: 18px; cursor: pointer; color: #1B1F2A; }
.sync .tm { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--mute); min-width: 120px; } .sync .tm b { color: var(--ink); font-size: 18px; }
.btn.tap { border-color: #F2B8B5; color: #B42318; } .btn.tap.on { background: #B42318; color: #fff; border-color: #B42318; }
#s-wave { width: 100%; height: 96px; margin: 14px 0; border-radius: 12px; background: #FAFBFD; border: 1px solid var(--line); cursor: pointer; display: block; }
.tapbar { display: flex; gap: 14px; align-items: center; justify-content: space-between; background: #FFF1F0; border: 1px solid #F2B8B5; border-radius: 14px; padding: 12px 16px; margin-bottom: 14px; }
.tapbar[hidden] { display: none; }
.tapbar > div > b { display: block; font-size: 16px; } .tapbar span { font-size: 13px; color: var(--mute); }
kbd { border: 1px solid #C7CBD6; border-bottom-width: 2px; border-radius: 6px; padding: 0 6px; font-size: 12px; background: #fff; }
.sg { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.sl { max-height: 520px; overflow: auto; border: 1px solid var(--line); border-radius: 14px; position: relative; }
.srow { display: grid; grid-template-columns: 28px 76px 28px 28px minmax(0, 1fr) 32px; gap: 6px; align-items: center; padding: 6px 10px; border-top: 1px solid var(--line); }
.srow:first-child { border-top: 0; }
.srow .n { color: var(--mute); font-size: 12px; text-align: right; font-weight: 700; }
.srow input { border: 1px solid transparent; border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 14px; background: transparent; min-width: 0; }
.srow input:hover, .srow input:focus { border-color: #D7DAE2; background: #fff; outline: none; }
.srow .tt { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--gold); }
.nb { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 13px; color: var(--ink); padding: 0; }
.nb:hover { border-color: var(--gold); }
.srow.done { opacity: .6; }
.srow.on { background: #FFF4DC; opacity: 1; } .srow.on .tx { font-weight: 700; }
.srow.tap { box-shadow: inset 4px 0 0 #B42318; background: #FFF1F0; opacity: 1; }
.kv { position: relative; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #0E0C0A; color: #F4EFE6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 22px; text-align: center; }
.kv .kbg { position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% -10%, rgba(232,176,75,.30), transparent 60%), radial-gradient(80% 60% at 100% 100%, rgba(140,40,40,.35), transparent 70%); }
.kv > * { position: relative; }
.ktag { font-size: 11px; letter-spacing: .24em; font-weight: 800; color: #E8B04B; min-height: 14px; }
.kl { line-height: 1.3; font-weight: 700; }
.kl.p, .kl.n { font-size: 16px; color: rgba(244,239,230,.42); min-height: 21px; }
.kl.c { font-size: 26px; font-weight: 800; color: transparent; -webkit-background-clip: text; background-clip: text; background-image: linear-gradient(#F6DFA8, #E8B04B), linear-gradient(rgba(244,239,230,.55), rgba(244,239,230,.55)); background-repeat: no-repeat; background-size: 0% 100%, 100% 100%; min-height: 34px; }
.kl.c.wait { background-image: none; color: rgba(244,239,230,.5); font-size: 20px; }
.kfoot { position: absolute; bottom: 10px; left: 0; right: 0; font-size: 10px; letter-spacing: .18em; color: rgba(244,239,230,.35); }
/* kênh */
.idc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 20px; align-items: center; margin-bottom: 16px; border-color: #C9DCF8; background: #F7FAFF; }
.idc .idt b { display: block; font-size: 16px; } .idc .idt span { color: var(--mute); font-size: 14px; }
.idc .idu { text-align: right; } .idc .idu b { display: block; font-size: 28px; font-weight: 800; color: #1559A8; } .idc .idu span { font-size: 12px; color: var(--mute); }
.idc .idb { display: flex; gap: 10px; flex-wrap: wrap; } .idc .idm { grid-column: 1 / -1; font-size: 13px; }
.chtool { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.chtool input { flex: 1; min-width: 180px; min-height: 40px; border: 1px solid #D7DAE2; border-radius: 10px; padding: 0 12px; font: inherit; }
.crow { display: grid; grid-template-columns: 34px 44px minmax(0, 1.4fr) 150px 190px 50px auto; gap: 12px; align-items: center; padding: 10px 4px; border-top: 1px solid var(--line); }
.crow.off { opacity: .5; }
.crow .ord { display: flex; flex-direction: column; gap: 2px; } .crow .ord .nb { width: 26px; height: 18px; font-size: 9px; border-radius: 5px; }
.crow .t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .crow .t small { color: var(--mute); font-size: 12px; }
.crow .id { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--mute); }
