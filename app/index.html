<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B0D12">
<title>Tổng Tài TV</title>
<style>
  /* Hiện nền tối và chữ "Đang tải" ngay, kể cả khi file CSS/JS tải chậm hoặc lỗi */
  html, body { margin: 0; background: #0B0D12; color: #F4F1EC; font-family: sans-serif; }
  #boot { position: fixed; left: 0; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 32px; z-index: 1; }
  #boot b { color: #E8B04B; font-size: 56px; margin-bottom: 18px; }
  #boot small { margin-top: 16px; font-size: 20px; color: #9AA0AE; }
  #booterr { position: fixed; left: 24px; right: 24px; bottom: 24px; z-index: 99999; padding: 18px 24px; border-radius: 14px; background: #7A1F1F; color: #fff; font: 20px/1.4 sans-serif; white-space: pre-wrap; display: none; }
</style>
<script>
  // Lỗi JavaScript hiện thẳng lên màn hình để chụp ảnh gửi lại
  window.onerror = function (msg, src, line, col) {
    var b = document.getElementById('booterr');
    if (!b) return;
    b.style.display = 'block';
    b.textContent += 'Lỗi: ' + msg + '\n' + String(src || '').split('/').pop() + ' dòng ' + line + ':' + col + '\n';
  };
</script>
<script>
  // Giao diện Sáng/Tối: áp dụng ngay từ đầu để không bị chớp màu
  try { if (localStorage.getItem('tt.themeFast') === 'light') document.documentElement.className += ' light'; } catch (e) {}
</script>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Tổng Tài TV">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/mobile2.css">
<!-- Font tải sau, không chặn màn hình (TV không vào được Google Fonts vẫn chạy) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
</head>
<body>
<div id="boot"><b>Tổng Tài TV</b>Đang tải…<small>phiên bản 2.9.2</small></div>
<div id="booterr"></div>
<div id="rotatehint">Xoay ngang điện thoại để xem rõ hơn</div>
<div id="app">
  <div id="topbar">
    <div class="brand">
      <svg width="48" height="48" viewBox="0 0 48 48"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAD680"/><stop offset="1" stop-color="#C48026"/></linearGradient></defs><rect width="48" height="48" rx="11" fill="url(#bg)"/><path d="M13 18v-6l5.5 3L24 8l5.5 7 5.5-3v6z" fill="#221206"/><rect x="13" y="19" width="22" height="2" fill="#221206"/><path d="M18 24v15l13-7.5z" fill="#221206"/></svg>
      <span>Tổng Tài <b>TV</b></span>
    </div>
    <div id="tabs"></div>
    <div id="clock"></div>
  </div>

  <div id="views"></div>

  <div id="player" class="hidden">
    <div id="yt-host"><div id="yt"></div></div>
    <div id="pl-ui">
      <div class="pl-top"><div id="pl-title"></div><div id="pl-sub"></div></div>
      <div class="pl-bot">
        <div class="pl-bar">
          <span id="pl-cur">00:00</span>
          <div class="pl-track"><div id="pl-fill"></div><div id="pl-knob"></div></div>
          <span id="pl-dur">00:00</span>
        </div>
        <div id="pl-btns"></div>
      </div>
      <div id="pl-menu" class="hidden"></div>
    </div>
    <div id="pl-msg" class="hidden"></div>
  </div>

  <div id="toast" class="hidden"></div>
</div>

<script src="$WEBAPIS/webapis/webapis.js" onerror="this.remove()"></script>
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/settings.js"></script>
<script src="js/sync.js"></script>
<script src="js/api.js"></script>
<script src="js/caticons.js"></script>
<script src="js/ui.js"></script>
<script src="js/player.js"></script>
<script src="js/screens.js"></script>
<script src="js/app.js"></script>
</body>
</html>
